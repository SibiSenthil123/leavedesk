# docker compose up --build   ->  API on http://localhost:8000/docs
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env          # copy .env.example to .env first
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  # PostgreSQL is not used yet (Day 2 keeps data in memory). It is here so
  # Day 3 only has to point the API at it.
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: leavedesk
      POSTGRES_USER: leavedesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leavedesk-dev-only}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leavedesk -d leavedesk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
