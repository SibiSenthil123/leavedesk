# docker compose up --build   ->  API on http://localhost:8000/docs
# docker compose up -d db     ->  only the database (for running the API with uvicorn)
x-database-url: &database-url
  LEAVEDESK_DATABASE_URL: postgresql+psycopg://leavedesk:${POSTGRES_PASSWORD:-leavedesk-dev-only}@db:5432/leavedesk

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env          # copy .env.example to .env first
    environment:
      <<: *database-url     # inside Docker the database is called "db", not localhost
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  # The postman: sends the emails waiting in the notification_outbox table.
  worker:
    build: .
    command: ["python", "-m", "leavedesk.worker"]
    env_file: .env
    environment:
      <<: *database-url
    depends_on:
      api:
        condition: service_healthy   # the api runs the migrations first

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: leavedesk
      POSTGRES_USER: leavedesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leavedesk-dev-only}
    ports:
      - "5433:5432"   # 5433 on your Mac (5432 is taken by another PostgreSQL), 5432 inside Docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leavedesk -d leavedesk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
